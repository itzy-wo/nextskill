<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding standard -->
  <meta charset="UTF-8">
  <!-- Mobile-friendly responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXT-SKILL - Chat with Pip</title>

  <!-- Google Fonts: Bagel Fat One for headings, Karla for body and chips -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Chat page specific stylesheet -->
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <!-- Top navigation bar with notebook brand and tally tracker -->
  <header class="chat-navbar">
    <!-- Brand link back to home welcome page -->
    <a href="index.html" class="brand-home-link" title="Back to welcome page">
      <span class="brand-text">NEXT-SKILL</span>
    </a>

    <!-- Hand-drawn 6-stroke tally mark progress tracker -->
    <div class="tally-box" aria-label="Progress tracker" id="tally-box">
      <span class="tally-label">Progress:</span>
      <!-- SVG rendering 6 tally marks (4 vertical, 1 diagonal cross, 1 extra) -->
      <svg class="tally-svg" viewBox="0 0 100 36" width="100" height="36" role="img" aria-label="Tally marks 0 of 6">
        <!-- Group of 5 tallies: 4 vertical lines + 1 diagonal slash -->
        <g id="tally-group-1">
          <!-- Stroke 1 -->
          <line id="tally-1" x1="12" y1="6" x2="12" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
          <!-- Stroke 2 -->
          <line id="tally-2" x1="22" y1="6" x2="22" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
          <!-- Stroke 3 -->
          <line id="tally-3" x1="32" y1="6" x2="32" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
          <!-- Stroke 4 -->
          <line id="tally-4" x1="42" y1="6" x2="42" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
          <!-- Stroke 5 (diagonal strike across 1-4) in Cherry #E63946 when active -->
          <line id="tally-5" x1="8" y1="28" x2="46" y2="8" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round" />
        </g>
        <!-- Group of 2nd tally (Stroke 6) -->
        <g id="tally-group-2">
          <!-- Stroke 6 -->
          <line id="tally-6" x1="62" y1="6" x2="62" y2="30" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
        </g>
      </svg>
      <!-- Human-readable tally number for screen readers and accessibility -->
      <span class="tally-counter" id="tally-counter">0 / 6</span>
    </div>
  </header>

  <!-- Main chat screen container -->
  <main class="chat-main">
    <div class="chat-card">

      <!-- Live message stream where bot sticky notes and user notes appear -->
      <section class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-atomic="false">
        <!-- Messages will be dynamically rendered here by chat.js -->
      </section>

      <!-- Bottom interaction zone for answer chips and text input -->
      <section class="chat-tray" id="chat-tray">
        <!-- Interactive chips or input will be rendered here dynamically -->
      </section>

    </div>
  </main>

  <!-- Chat scripted logic -->
  <script src="chat.js"></script>
</body>
</html>
